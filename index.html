<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manso" />
    <meta name="theme-color" content="#000000" />
    <title>Manso Club</title>
    <!-- Vista previa del link (WhatsApp, Instagram, Telegram): los rastreadores
         no ejecutan JavaScript, así que esto tiene que estar en el HTML. Las
         páginas de evento las pisa api/og.ts con el nombre, la fecha y el
         flyer de cada una. La imagen va con URL absoluta (la piden así): si
         el dominio público cambia, se cambia acá y en og-default.png. -->
    <meta name="description" content="Entradas y agenda de Manso Club." />
    <meta property="og:site_name" content="Manso Club" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Manso Club" />
    <meta property="og:description" content="Entradas y agenda de Manso Club." />
    <meta property="og:image" content="https://manso-gestion.vercel.app/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- El negro va acá y no solo en el CSS: es lo que pinta el navegador
         antes de bajar la hoja de estilos y montar React. Sin esto, cada
         arranque muestra un destello blanco. -->
    <style>html, body { background-color: #000000; color-scheme: dark; }</style>
    <!-- La foto de fondo se recuerda en el dispositivo (ver lib/fondoCache.ts)
         y se pinta acá, antes de bajar el bundle: es lo primero que se ve, sin
         esperar a que React monte ni a que Supabase conteste. El velo es el
         mismo 45% que le aplica Background.tsx, para que no haya un salto de
         luz cuando React toma el relevo. -->
    <script>
      (function () {
        try {
          var fondo = localStorage.getItem('manso:fondo')
          if (!fondo) return
          var html = document.documentElement
          html.style.backgroundImage =
            'linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url("' + fondo.replace(/"/g, '%22') + '")'
          html.style.backgroundSize = 'cover'
          html.style.backgroundPosition = 'center'
          html.style.backgroundRepeat = 'no-repeat'
          html.style.backgroundAttachment = 'fixed'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
